<body>
<div class="app" id="app" data-screen="loading">
    <div class="sky" aria-hidden="true">
      <div class="cloud cloud-1"></div>
      <div class="cloud cloud-2"></div>
      <div class="cloud cloud-3"></div>
      <div class="cloud cloud-4"></div>
    </div>

    <canvas class="stage" id="stage" aria-label="Game board. Swipe or tap two neighbouring candies to swap them; with a keyboard, use the arrow keys and Enter." role="application"></canvas>

    <header class="hud" id="hud" aria-label="Level status">
      <div class="hud-top">
        <button class="round-btn" id="pause-btn" type="button" aria-label="Pause">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="1.6"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.6"/></svg>
        </button>
        <p class="hud-title"><span class="hud-level" id="hud-level">Level 1</span><span class="hud-name" id="hud-name">First Bite</span></p>
      </div>
      <div class="hud-panels">
        <div class="panel hud-moves" id="hud-moves">
          <img src="assets/items/stopwatch.png" alt="" class="moves-icon" width="40" height="40">
          <div class="stat">
            <output class="stat-num" id="moves" aria-label="Moves left">20</output>
            <span class="stat-label">moves</span>
          </div>
        </div>
        <div class="panel hud-goals">
          <span class="stat-label">Goals</span>
          <ul class="goal-list" id="goal-list"></ul>
        </div>
        <div class="panel hud-score">
          <span class="stat-label">Score</span>
          <output class="stat-num score-num" id="score" aria-label="Score">0</output>
          <div class="meter" id="meter" aria-hidden="true">
            <div class="meter-track"><div class="meter-fill" id="meter-fill"></div></div>
            <img class="meter-star" src="assets/candies/star.png" alt="" data-star="0">
            <img class="meter-star" src="assets/candies/star.png" alt="" data-star="1">
            <img class="meter-star" src="assets/candies/star.png" alt="" data-star="2">
          </div>
        </div>
      </div>
