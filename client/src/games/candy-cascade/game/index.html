<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#66d6da">
  <meta name="description" content="Candy Cascade: a match-3 candy game with fluid, physics-driven animation.">
  <title>Candy Cascade</title>
  <link rel="icon" type="image/png" href="assets/candies/star.png">
  <!-- fonts:start -->
  <link rel="preload" href="assets/fonts/LilitaOne-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <!-- fonts:end -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- app:start -->
  <div class="app" id="app" data-screen="loading">
    <div class="sky" aria-hidden="true">
      <div class="cloud cloud-1"></div>
      <div class="cloud cloud-2"></div>
      <div class="cloud cloud-3"></div>
      <div class="cloud cloud-4"></div>
    </div>

    <canvas class="stage" id="stage" aria-label="Game board. Swipe or tap two neighbouring candies to swap them; with a keyboard, use the arrow keys and Enter." role="application"></canvas>

    <header class="hud" id="hud" aria-label="Level status">
      <div class="hud-top">
        <button class="round-btn" id="pause-btn" type="button" aria-label="Pause">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="1.6"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.6"/></svg>
        </button>
        <p class="hud-title"><span class="hud-level" id="hud-level">Level 1</span><span class="hud-name" id="hud-name">First Bite</span></p>
      </div>
      <div class="hud-panels">
        <div class="panel hud-moves" id="hud-moves">
          <img src="assets/items/stopwatch.png" alt="" class="moves-icon" width="40" height="40">
          <div class="stat">
            <output class="stat-num" id="moves" aria-label="Moves left">20</output>
            <span class="stat-label">moves</span>
          </div>
        </div>
        <div class="panel hud-goals">
          <span class="stat-label">Goals</span>
          <ul class="goal-list" id="goal-list"></ul>
        </div>
        <div class="panel hud-score">
          <span class="stat-label">Score</span>
          <output class="stat-num score-num" id="score" aria-label="Score">0</output>
          <div class="meter" id="meter" aria-hidden="true">
            <div class="meter-track"><div class="meter-fill" id="meter-fill"></div></div>
            <img class="meter-star" src="assets/candies/star.png" alt="" data-star="0">
            <img class="meter-star" src="assets/candies/star.png" alt="" data-star="1">
            <img class="meter-star" src="assets/candies/star.png" alt="" data-star="2">
          </div>
        </div>
      </div>
    </header>

    <section class="screen title-screen" id="title-screen" aria-labelledby="game-title">
      <div class="title-card">
        <h1 class="logo" id="game-title" aria-label="Candy Cascade"></h1>
        <p class="tagline">Swap. Match. Watch it all come tumbling down.</p>
        <button class="btn btn-candy btn-play" id="play-btn" type="button">Play</button>
        <div class="toggles">
          <button class="chip" id="sound-toggle" type="button" aria-pressed="true">Sound</button>
          <button class="chip" id="music-toggle" type="button" aria-pressed="true">Music</button>
        </div>
      </div>
    </section>

    <section class="screen map-screen" id="map-screen" aria-labelledby="map-title">
      <div class="map-bar">
        <button class="round-btn" id="map-back" type="button" aria-label="Back to the title screen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="episode-nav">
          <button class="round-btn episode-arrow" id="episode-prev" type="button" aria-label="Previous episode">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="episode-title">
            <h2 class="map-title" id="map-title">Sugar Meadow</h2>
            <p class="map-sub" id="map-sub">Episode 1 · Levels 1–20</p>
          </div>
          <button class="round-btn episode-arrow" id="episode-next" type="button" aria-label="Next episode">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 5.5 16 12l-6.5 6.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <p class="star-total" aria-label="Stars collected"><img src="assets/candies/star.png" alt="" width="26" height="26"><span id="star-total">0 / 900</span></p>
      </div>
      <div class="map-scroll" id="map-scroll">
        <div class="map-path" id="map-path"></div>
      </div>
    </section>

    <div class="modal-layer" id="modal-layer" hidden>
      <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div>
    </div>

    <canvas class="fx" id="fx" aria-hidden="true"></canvas>

    <div class="loading" id="loading" role="status" aria-live="polite">
      <img src="assets/candies/donut.png" alt="" class="loading-candy" width="72" height="72">
      <div class="loading-bar"><div class="loading-fill" id="loading-fill"></div></div>
      <span class="loading-text" id="loading-text">Loading sweets…</span>
    </div>
  </div>
  <!-- app:end -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
